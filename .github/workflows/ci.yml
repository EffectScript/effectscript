name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: TypeCheck & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: TypeCheck compiler
        working-directory: packages/compiler
        run: npm run typecheck

      - name: TypeCheck CLI
        working-directory: packages/cli
        run: npm run typecheck

      - name: Test compiler
        working-directory: packages/compiler
        run: npm run test

      - name: Test CLI
        working-directory: packages/cli
        run: npm run test

      - name: Build compiler
        working-directory: packages/compiler
        run: npm run build

      - name: Build CLI
        working-directory: packages/cli
        run: npm run build
